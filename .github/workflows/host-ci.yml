name: Host CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S host -B build/host

      - name: Build
        run: cmake --build build/host --config Debug

      - name: Test
        run: ctest --test-dir build/host --build-config Debug --output-on-failure
