name: Protocol CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S protocol -B build/protocol

      - name: Build
        run: cmake --build build/protocol --config Debug

      - name: Test
        run: ctest --test-dir build/protocol --build-config Debug --output-on-failure
